[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-kb-agent"
version = "0.8.3"
description = "A local, index-guided personal knowledge question-answering system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "cryptography>=44,<47",
    "fastapi[standard]>=0.115,<1",
    "httpx>=0.28,<1",
    "huey>=2.5,<3",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "markitdown[all]>=0.1,<0.2",
    "markitdown-ocr>=0.1,<0.2",
    "openai>=1.60,<3",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "sqlalchemy>=2.0,<3",
    "supervisor>=4.2,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "respx>=0.22,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.png", "static/*.svg", "static/*.css", "static/*.js", "templates/*.html"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
